<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>网页文件浏览器</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  </head>
  <body>
    <main class="container">
      <section class="tabbar-wrap glass">
        <div id="tabbar" class="tabbar"></div>
        <button id="new-tab-btn" type="button" class="btn primary">+ 新建标签页</button>
      </section>

      <section class="toolbar glass">
        <button id="back-btn" type="button" class="btn">↩ 后退</button>
        <button id="up-btn" type="button" class="btn">⬆ 返回上级</button>
        <div class="path-box">
          <input id="path-input" type="text" autocomplete="off" />
          <div id="path-suggestions" class="path-suggestions"></div>
        </div>
      </section>

      <code id="root-path" style="display:none">{{ browse_root }}</code>

      <section class="layout" id="split-layout">
        <article class="panel left-panel glass" id="left-panel">
          <div class="browser-toolbar">
            <div class="panel-head">
              <h2>文件夹浏览</h2>
              <div class="display-controls compact-controls">
                <label class="compact-item">排序
                  <select id="sort-select">
                    <option value="type">类型</option>
                    <option value="name">名称</option>
                    <option value="size">大小</option>
                    <option value="modified">修改日期</option>
                  </select>
                </label>
                <button id="sort-order-btn" type="button" class="btn">升序 ↑</button>
                <label class="compact-item search-item">搜索
                  <input id="search-input" type="text" placeholder="按文件名过滤（空格=与）" />
                </label>
                <button id="toggle-display-settings" type="button" class="btn">展开显示设置 ▾</button>
              </div>
            </div>
            <div id="display-settings" class="display-settings">
              <label>图标大小 <span id="icon-size-label">44</span>
                <input id="icon-size" type="range" min="28" max="88" step="4" value="44" />
              </label>
              <label>列数 <span id="column-count-label">3</span>
                <input id="column-count" type="range" min="1" max="8" step="1" value="3" />
              </label>
              <label>信息密度 <span id="density-label">高</span>
                <input id="density-slider" type="range" min="1" max="3" step="1" value="3" />
              </label>
            </div>
          </div>

          <div id="file-grid" class="file-grid"></div>
          <p id="status"></p>
        </article>

        <div id="resizer" class="resizer" title="拖动调整左右栏宽度"></div>

        <article class="panel right-panel glass" id="right-panel">
          <h2>文件预览</h2>
          <div id="preview-meta" class="preview-meta">请从左侧选择一个文件进行预览。</div>
          <div id="preview-content" class="preview-content"></div>
        </article>
      </section>
    </main>

    <div id="context-menu" class="context-menu"></div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
